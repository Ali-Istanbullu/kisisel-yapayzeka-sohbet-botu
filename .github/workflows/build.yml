name: Windows EXE Derleyici

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Python'u Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # En stabil sürüm

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: PyInstaller ile EXE'ye Çevir
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon="ikon.ico" baslat.py

    - name: Çıktıyı GitHub'a Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: YapayZekaBotu-Windows
        path: dist/baslat/