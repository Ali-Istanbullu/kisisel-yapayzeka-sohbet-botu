name: Veri Akisi Testi

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-veritabani:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Gereksinimleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install sqlalchemy customtkinter

    - name: Veri Akışı Testini Çalıştır
      # Testi çalıştırırken 'tests' klasöründeki dosyayı hedef gösteriyoruz
      run: |
        python -m unittest tests/test_veri_akisi.py